<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VedaGPT — RAG Interface</title>
    <meta name="description" content="Ask questions about Vedic scriptures using AI-powered retrieval augmented generation">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --accent: #f59e0b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --source-bg: rgba(139, 92, 246, 0.08);
            --source-border: rgba(139, 92, 246, 0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }

        body {
            background-color: var(--bg-color);
            background-image:
                radial-gradient(circle at 15% 50%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(245, 158, 11, 0.10) 0%, transparent 50%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .container {
            width: 100%;
            max-width: 960px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 1.5rem 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 1rem;
            height: 90vh;
            position: relative;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--glass-border);
        }

        .header-left { display: flex; align-items: baseline; gap: 0.75rem; }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #a78bfa, #fcd34d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .badge-rag {
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            background: linear-gradient(135deg, var(--primary), #6d28d9);
            color: white;
            padding: 3px 10px;
            border-radius: 20px;
        }

        .btn-check {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text);
            padding: 0.4rem 0.9rem;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-check:hover { background: rgba(255, 255, 255, 0.1); transform: translateY(-1px); }

        .status-dot {
            width: 9px; height: 9px; border-radius: 50%;
            background-color: var(--text-muted);
            transition: background-color 0.3s ease;
        }
        .status-dot.online { background-color: #10b981; box-shadow: 0 0 8px #10b981; }
        .status-dot.offline { background-color: #ef4444; box-shadow: 0 0 8px #ef4444; }
        .status-dot.loading { background-color: var(--accent); box-shadow: 0 0 8px var(--accent); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

        .chat-container {
            flex: 1; overflow-y: auto;
            display: flex; flex-direction: column; gap: 0.75rem;
            padding-right: 0.5rem;
        }

        .chat-container::-webkit-scrollbar { width: 5px; }
        .chat-container::-webkit-scrollbar-track { background: transparent; }
        .chat-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }

        .message {
            max-width: 85%;
            padding: 0.9rem 1.1rem;
            border-radius: 18px;
            line-height: 1.55;
            animation: fadeIn 0.35s ease-out forwards;
            opacity: 0;
            transform: translateY(8px);
            font-size: 0.95rem;
        }

        .message.system {
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid rgba(139, 92, 246, 0.2);
            align-self: center;
            text-align: center;
            font-size: 0.88rem;
            color: var(--text-muted);
            max-width: 90%;
        }

        .message.user {
            background: linear-gradient(135deg, var(--primary), #6d28d9);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.25);
        }

        .message.assistant {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            max-width: 90%;
        }

        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }

        /* ── Sources ── */
        .sources-toggle {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            margin-top: 0.6rem;
            font-size: 0.78rem;
            color: var(--accent);
            cursor: pointer;
            font-weight: 600;
            user-select: none;
            transition: color 0.2s;
        }
        .sources-toggle:hover { color: #fbbf24; }
        .sources-toggle .arrow { transition: transform 0.3s; display: inline-block; }
        .sources-toggle.open .arrow { transform: rotate(90deg); }

        .sources-list {
            display: none;
            margin-top: 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
        .sources-list.hidden { display: none; }

        .source-card {
            background: var(--source-bg);
            border: 1px solid var(--source-border);
            border-radius: 10px;
            padding: 0.6rem 0.8rem;
            font-size: 0.8rem;
            line-height: 1.45;
        }

        .source-header {
            font-weight: 600;
            color: #c4b5fd;
            font-size: 0.75rem;
            margin-bottom: 0.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .source-score {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .source-text {
            color: var(--text-muted);
            font-size: 0.78rem;
        }

        /* ── Input ── */
        .input-area {
            display: flex;
            gap: 0.75rem;
            background: rgba(0, 0, 0, 0.2);
            padding: 0.4rem;
            border-radius: 18px;
            border: 1px solid var(--glass-border);
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            padding: 0.65rem 0.9rem;
            font-size: 0.95rem;
            resize: none;
            height: 46px;
            max-height: 120px;
            outline: none;
            font-family: 'Outfit', sans-serif;
        }
        textarea::placeholder { color: var(--text-muted); }

        .btn-send {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 14px;
            width: 46px; height: 46px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 3px 12px rgba(139, 92, 246, 0.35);
            flex-shrink: 0;
        }
        .btn-send:hover { background: var(--primary-hover); transform: scale(1.05); }
        .btn-send:disabled { background: var(--text-muted); cursor: not-allowed; transform: none; box-shadow: none; }

        .typing-indicator {
            display: none;
            align-items: center;
            gap: 0.3rem;
            padding: 0.9rem 1.1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            align-self: flex-start;
            width: fit-content;
        }
        .typing-indicator span {
            width: 6px; height: 6px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%,80%,100% { transform: scale(0); } 40% { transform: scale(1); } }

        .toast {
            position: absolute;
            top: 1.5rem; right: 1.5rem;
            padding: 0.8rem 1.2rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.88rem;
            opacity: 0;
            transform: translateY(-15px);
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            pointer-events: none;
            z-index: 100;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid #10b981;
            color: #10b981;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.error { background: rgba(239, 68, 68, 0.15); border-color: #ef4444; color: #ef4444; }
        .toast.warning { background: rgba(245, 158, 11, 0.15); border-color: var(--accent); color: var(--accent); }
    </style>
</head>
<body>
    <div class="toast" id="toast"></div>

    <div class="container">
        <header>
            <div class="header-left">
                <h1>VedaGPT</h1>
                <span class="badge-rag">RAG</span>
            </div>
            <button class="btn-check" id="checkEnvBtn" onclick="checkEnvironment()">
                <div class="status-dot" id="statusDot"></div>
                Check Env
            </button>
        </header>

        <div class="chat-container" id="chatContainer">
            <div class="message system">
                🙏 Namaste! I am VedaGPT with <b>RAG</b> — I retrieve relevant passages from the Vedic scriptures before answering. Ask me anything about the Vedas, Charaka Samhita, Sushruta Samhita, and more.
            </div>
        </div>

        <div class="typing-indicator" id="typingIndicator">
            <span></span><span></span><span></span>
        </div>

        <div class="input-area">
            <textarea id="promptInput" placeholder="Ask about the Vedas... (e.g., What does the Rig Veda say about Agni?)" rows="1"></textarea>
            <button class="btn-send" id="sendBtn" onclick="sendMessage()">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const promptInput = document.getElementById('promptInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingIndicator = document.getElementById('typingIndicator');
        const toast = document.getElementById('toast');
        const statusDot = document.getElementById('statusDot');

        promptInput.addEventListener('input', function() {
            this.style.height = '46px';
            this.style.height = (this.scrollHeight) + 'px';
        });

        promptInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function appendMessage(content, role, sources) {
            const div = document.createElement('div');
            div.className = `message ${role}`;

            let html = content.replace(/\n/g, '<br>');

            // Add sources for assistant messages
            if (role === 'assistant' && sources && sources.length > 0) {
                const srcId = 'src-' + Date.now();
                html += `
                    <div class="sources-toggle" onclick="toggleSources('${srcId}', this)">
                        <span class="arrow">▶</span> ${sources.length} source${sources.length > 1 ? 's' : ''} retrieved
                    </div>
                    <div class="sources-list hidden" id="${srcId}">
                `;
                sources.forEach((src, i) => {
                    const label = [src.collection, src.book ? `Book ${src.book}` : '', src.hymn, src.title].filter(Boolean).join(' · ');
                    html += `
                        <div class="source-card">
                            <div class="source-header">
                                <span>📜 ${label || 'Source ' + (i+1)}</span>
                                <span class="source-score">relevance: ${(src.rerank_score || 0).toFixed(3)}</span>
                            </div>
                            <div class="source-text">${(src.text || '').replace(/\n/g, ' ').substring(0, 200)}${src.text && src.text.length > 200 ? '…' : ''}</div>
                        </div>
                    `;
                });
                html += '</div>';
            }

            div.innerHTML = html;
            chatContainer.appendChild(div);
            scrollToBottom();
        }

        function toggleSources(id, el) {
            const list = document.getElementById(id);
            list.classList.toggle('hidden');
            el.classList.toggle('open');
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function showToast(message, type) {
            toast.textContent = message;
            toast.className = 'toast show' + (type ? ' ' + type : '');
            setTimeout(() => { toast.className = 'toast'; }, 3500);
        }

        async function checkEnvironment() {
            statusDot.className = 'status-dot';
            try {
                const res = await fetch('/api/health');
                const data = await res.json();
                if (res.ok && data.environment_correct) {
                    statusDot.className = 'status-dot online';
                    const ragLabel = data.rag_enabled ? ' + RAG' : '';
                    showToast(`✅ Model loaded${ragLabel} · MongoDB ${data.mongodb_connected ? '✓' : '✗'}`);
                } else if (data.warmup_status === 'loading') {
                    statusDot.className = 'status-dot loading';
                    showToast('⏳ Model loading on GPU... please wait', 'warning');
                } else {
                    statusDot.className = 'status-dot offline';
                    showToast('⚠️ ' + (data.warmup_status || 'Not ready'), 'error');
                }
            } catch (err) {
                statusDot.className = 'status-dot offline';
                showToast('❌ Cannot reach server!', 'error');
            }
        }

        async function sendMessage() {
            const prompt = promptInput.value.trim();
            if (!prompt) return;

            promptInput.value = '';
            promptInput.style.height = '46px';
            sendBtn.disabled = true;
            promptInput.disabled = true;

            appendMessage(prompt, 'user');
            typingIndicator.style.display = 'flex';
            scrollToBottom();

            try {
                const res = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });

                if (!res.ok) throw new Error('API Error');

                const data = await res.json();
                typingIndicator.style.display = 'none';
                appendMessage(data.response, 'assistant', data.sources || []);

                if (data.elapsed) {
                    showToast(`Generated in ${data.elapsed}s · ${(data.sources || []).length} sources`);
                }
            } catch (err) {
                typingIndicator.style.display = 'none';
                appendMessage('Sorry, an error occurred while processing your request.', 'system');
                showToast('Failed to generate response.', 'error');
            } finally {
                sendBtn.disabled = false;
                promptInput.disabled = false;
                promptInput.focus();
            }
        }

        setTimeout(checkEnvironment, 800);
    </script>
</body>
</html>
